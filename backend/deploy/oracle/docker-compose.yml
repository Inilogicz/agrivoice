# AgriVoice backend on an Oracle Cloud Always Free ARM server.
#   api   – FastAPI + NCAIR speech models + Meta language detection (CPU)
#   caddy – HTTPS reverse proxy with a free Let's Encrypt certificate
# N-ATLaS runs remotely (Kaggle); point to it from /admin.
services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - app_data:/data
      - model_cache:/home/user/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app_data:
  model_cache:
  caddy_data:
  caddy_config:
