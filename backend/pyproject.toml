[project]
name = "agrivoice-backend"
version = "0.1.0"
description = "Multilingual voice-first agricultural assistant backend for Nigerian smallholder farmers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Configuration
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database (async SQLAlchemy 2 + PostgreSQL driver)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # Logging
    "structlog>=24.4.0",
    # Database driver for SQLite deployments (PostgreSQL uses asyncpg)
    "aiosqlite>=0.20.0",
    # Model inference. The Dockerfile installs the CPU build of torch;
    # on GPU servers install the CUDA build from download.pytorch.org.
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    # Audio processing
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "torchaudio>=2.4.0",  # requires matching torch version
    # Hugging Face Hub (model downloads, gated access)
    "huggingface-hub>=0.25.0",
    # Remote N-ATLaS (Gradio app on Kaggle / Hugging Face) and Kaggle control
    "gradio-client>=2.7",
    "kaggle>=2.2",
    # Time zones for the N-ATLaS schedule (slim images lack system tzdata)
    "tzdata>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pyrefly]
# The Kaggle notebook template is data for natlas_runner, not backend code
project-excludes = ["app/resources/**"]
